<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Registrera konto</title>
</head>
<body>
  <h1>Registrera ny användare</h1>
  <form id="registerForm">
    <input type="text" id="name" placeholder="Namn" required><br><br>
    <input type="email" id="email" placeholder="E-post" required><br><br>
    <input type="password" id="password" placeholder="Lösenord" required><br><br>
    <select id="role">
      <option value="user">Användare</option>
      <option value="admin">Admin</option>
    </select><br><br>
    <button type="submit">Registrera</button>
  </form>

  <p id="message"></p>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      try {
        const res = await fetch('http://localhost:3000/api/auth/register', {
            method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role })
        });

        const data = await res.json();

        if (res.ok) {
          document.getElementById('message').innerText = 'Registrering lyckades!';
        } else {
          document.getElementById('message').innerText = data.message || 'Registrering misslyckades';
        }
      } catch (err) {
  console.error("❌ Fel vid registrering:", err); // 👈 denna rad visar hela felet
  document.getElementById('message').innerText = 'Något gick fel!';
}

    });
  </script>
</body>
</html>
